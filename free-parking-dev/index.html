<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Parking Monitor</title>
    <link rel="icon" type="image/png" href="./assets/parking_favicon.png" />
    <script type="module" crossorigin src="/free-parking-dev/assets/index-CdYFfwBv.js"></script>
  </head>

  <body>
    <div id="root"></div>


    <script>
      (function () {
        function isAndroid() {
          const ua = navigator.userAgent || navigator.vendor || window.opera;
          const detected = /Android/i.test(ua);
          // When running in dev mode (`?dev`), behave like non-Android to
          // allow debugging mobile flows without redirect/modal differences.
          try {
            return detected && !hasDevMode();
          } catch (e) {
            return detected;
          }
        }

        function getParam(name) {
          return new URLSearchParams(window.location.search).get(name);
        }

        function hasDevMode() {
          const v = getParam('dev');
          return v !== null && v !== 'false' && v !== '0';
        }

        function hasShowInfo() {
          const v = getParam('showInfo');
          return v !== null && v !== 'false' && v !== '0';
        }

        function runRedirectChecks() {
          if (hasDevMode()) {
            document.title = 'Parking Monitor DEV';
          }
          // Intentionally do not auto-redirect Android users here. Redirection
          // to Play Store should only happen in response to the user's
          // explicit action (the Continue button) to avoid loops.
        }

        // If the page is shown again (e.g., user returns from Play Store via back),
        // ensure Android users see the modal again. Use sessionStorage as a
        // short-lived flag to detect returns from the redirect.
        window.addEventListener('pageshow', (ev) => {
          try {
            // Only act for Android browsers and when we are not already forcing showInfo
            if (isAndroid() && !hasShowInfo() && sessionStorage.getItem('fp_returning_from_play')) {
              sessionStorage.removeItem('fp_returning_from_play');
              const url = new URL(window.location.href);
              url.searchParams.set('showInfo', '1');
              // Use replace to avoid polluting history; this triggers a full reload
              window.location.replace(url.toString());
            }
          } catch (e) {
            // ignore
          }
        });

        document.addEventListener('DOMContentLoaded', () => {
          const KEY = 'parking_info_seen';

          // Support `?clear=1` URL param to clear the stored seen flag.
          // Useful for testing or forcing the modal to reappear for a user.
          try {
            if (getParam('clear') !== null) {
              localStorage.removeItem(KEY);
            }
          } catch (e) {
            // ignore storage errors
          }
          // Always force-show the info modal for Android browsers
          const forceShow = hasShowInfo() || isAndroid();

          if (!forceShow && localStorage.getItem(KEY)) {
            runRedirectChecks();
            // If not on Android (redirected), import the app immediately
            if (!isAndroid() && window.__importApp) window.__importApp();
            return;
          }

          // Create modal
          const modal = document.createElement('div');
          modal.style.position = 'fixed';
          modal.style.inset = '0';
          modal.style.background = 'rgba(0,0,0,0.5)';
          modal.style.display = 'flex';
          modal.style.alignItems = 'center';
          modal.style.justifyContent = 'center';
          modal.style.zIndex = '9999';

          const card = document.createElement('div');
          card.style.background = '#fff';
          card.style.color = '#111';
          card.style.opacity = '1';
          card.style.filter = 'none';
          card.style.transition = 'none';
          card.style.padding = '20px';
          card.style.borderRadius = '8px';
          card.style.maxWidth = '480px';
          card.style.width = '90%';
          card.style.boxSizing = 'border-box';
          card.innerHTML = `
            <h2 style="margin:0 0 8px">Welcome to Parking Monitor</h2>
            <p style="margin:0 0 12px">My name is <strong>Piotr Sakowski</strong>. I created this app for <strong>You</strong> to make parking availability check easier and more reliable.</p>
            <p style="margin:0 0 12px">
             This app indicates whether the data is <strong>actual</strong>, includes a <strong><span style="white-space:nowrap">2-day history</span></strong>, and helps <strong>predict</strong> the best time to arrive at the office next time. <br/>Something the <span style="text-decoration:underline">original page fails to provide</span>.</p>
            <p style="margin:0 0 12px">If you find this app useful you can buy me coffee: <a href="https://buycoffee.to/piotereks" target="_blank" rel="noopener noreferrer" style="color:#b5651d;text-decoration:underline;font-weight:500" aria-label="Buy me a coffee (opens in new tab)">buycoffee.to/piotereks</a></p>
            <p style="margin:0 0 16px">Tap <strong>Continue</strong> to proceed.</p>
            <div style="text-align:right">
              <button id="fp-continue" style="padding:8px 12px"><strong>&gt;Continue</strong></button>
            </div>
          `;

          modal.appendChild(card);
          document.body.appendChild(modal);
          document.body.style.overflow = 'hidden';

          // Track intentional close vs. unexpected removal
          let intentionalClose = false;
          let isRedirecting = false;

          document.getElementById('fp-continue').addEventListener('click', () => {
            try {
              // Do not persist the seen flag for Android users so modal shows every time
              if (!isAndroid()) localStorage.setItem(KEY, '1');
            } catch (e) {}

            // Android users: redirect to Play Store but keep the modal in the DOM
            // so returning users still see it. Do not mark as intentionalClose
            // or remove the modal here.
            if (isAndroid()) {
              try { sessionStorage.setItem('fp_returning_from_play', '1'); } catch (e) {}
              isRedirecting = true;
              window.location.href = 'https://play.google.com/store/apps/details?id=app.piotereks.freeparking';
              return;
            }

            // Non-Android flow: close modal and import the app
            intentionalClose = true;
            if (modal.parentNode) modal.parentNode.removeChild(modal);
            document.body.style.overflow = '';

            runRedirectChecks();
            if (window.__importApp) window.__importApp();
          });

          // If the modal is removed unexpectedly on Android (skipped/closed), reload
          // with showInfo=1 so modal appears again and user cannot access the page.
          if (isAndroid()) {
            const observer = new MutationObserver(() => {
              if (!modal.parentNode && !intentionalClose && !isRedirecting) {
                // force reload with showInfo to re-open modal
                const url = new URL(window.location.href);
                url.searchParams.set('showInfo', '1');
                // reload (replace to avoid polluting history)
                window.location.replace(url.toString());
              }
            });
            observer.observe(document.body, { childList: true, subtree: true });
          }
        });
      })();
    </script>

    
  </body>
</html>
