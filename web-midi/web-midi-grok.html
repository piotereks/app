<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDI Sound Generator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { padding: 10px; margin: 5px; }
        #status { color: green; }
    </style>
</head>
<body>
    <h1>MIDI Sound Generator Minimal Example</h1>
    <button id="midiBtn">Enable MIDI</button>
    <div id="status"></div>
    <div id="notes"></div>

    <script>
        let audioContext;
        let midiAccess;
        let activeNotes = new Map();

        async function initAudio() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        async function enableMIDI() {
            try {
                midiAccess = await navigator.requestMIDIAccess();
                document.getElementById('status').textContent = 'MIDI enabled. Connect your keyboard.';
                midiAccess.inputs.forEach(input => {
                    input.onmidimessage = handleMIDIMessage;
                });
            } catch (e) {
                document.getElementById('status').textContent = 'MIDI not available: ' + e;
            }
        }

        function handleMIDIMessage(message) {
            const [status, data1, data2] = message.data;
            const command = status & 0xF0;
            const channel = status & 0x0F;

            if (command === 0x90 && data2 > 0) { // Note On
                playNote(data1, data2);
            } else if (command === 0x80 || (command === 0x90 && data2 === 0)) { // Note Off
                stopNote(data1);
            }
            // Add more for CC, etc.
        }

        function playNote(midiNote, velocity) {
            if (activeNotes.has(midiNote)) return;

            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();

            oscillator.type = 'sawtooth';
            oscillator.frequency.value = 440 * Math.pow(2, (midiNote - 69) / 12);
            gain.gain.value = velocity / 127;

            oscillator.connect(gain);
            gain.connect(audioContext.destination);

            oscillator.start();
            activeNotes.set(midiNote, {oscillator, gain});

            document.getElementById('notes').innerHTML += `<p>Note ON: ${midiNote} vel:${velocity}</p>`;
        }

        function stopNote(midiNote) {
            const note = activeNotes.get(midiNote);
            if (note) {
                note.gain.gain.linearRampToValueAtTime(0, audioContext.currentTime + 0.1);
                note.oscillator.stop(audioContext.currentTime + 0.2);
                activeNotes.delete(midiNote);
            }
        }

        document.getElementById('midiBtn').addEventListener('click', () => {
            initAudio();
            enableMIDI();
        });
    </script>
</body>
</html>
